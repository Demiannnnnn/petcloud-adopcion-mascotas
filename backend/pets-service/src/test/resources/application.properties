# Configuración solo para tests: H2 en memoria para no modificar data/petsdb.mv.db
spring.application.name=pets-service
spring.datasource.url=jdbc:h2:mem:petsdb-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
