spring.application.name=donations-service
server.port=8084

# Configuración H2 con persistencia
spring.datasource.url=${DB_URL:jdbc:h2:mem:donationsdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate configuración
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=never

# H2 Console (solo para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# SQL inicialización - DESHABILITADO para evitar conflictos
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:donations_service_schema.sql
# spring.sql.init.data-locations=classpath:data.sql

# Mercado Pago Configuration
# Access Token inyectado vía variable de entorno
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}
app.frontend.url=${APP_FRONTEND_URL:https://localhost}
